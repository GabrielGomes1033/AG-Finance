<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notícias Cripto — CoinTelegraph</title>

<style>
  *{
    box-sizing:border-box;
  }

  body{
    background:#020617;
    font-family: Arial, Helvetica, sans-serif;
    color:#e5e7eb;
    margin:0;
  }

  /* ------------------ TOPO ------------------ */
  .topbar{
    background:#1f2850;
    padding:18px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-radius:0 0 16px 16px;
  }

  .topbar h1{
    margin:0;
    font-size:20px;
  }

  .topbar nav{
    display:flex;
    gap:18px;
  }

  .topbar nav a{
    display:inline-flex;
    align-items:center;
    white-space:nowrap;
    color:#cbd5e1;
    text-decoration:none;
    padding:8px 10px;
    border-radius:8px;
    transition:.2s;
  }

  .topbar nav a:hover{
    background:#111827;
    color:white;
  }

  /* ------------------ CARDS ------------------ */
  .news-widget{
    max-width: 1050px;
    margin: 40px auto;
    padding: 25px;
    border-radius: 16px;
    background: #0f172a;
    box-shadow: 0 10px 25px rgba(0,0,0,.25);
  }

  .news-widget h2{
    margin:0 0 20px;
    font-size: 22px;
  }

  .cards{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 22px;
  }

  .card{
    border-radius: 16px;
    overflow: hidden;
    background:#ffffff;
    color:#111;
    box-shadow: 0 6px 20px rgba(0,0,0,.08);
    transition:.25s;
  }

  .card:hover{
    transform: translateY(-3px);
    box-shadow:0 10px 28px rgba(0,0,0,.12);
  }

  .card-img{
    width:100%;
    height:210px;
    object-fit:cover;
    display:block;
    transition:.25s;
  }

  .card:hover .card-img{
    transform: scale(1.03);
  }

  .card-body{
    padding:14px 16px 18px;
  }

  .title{
    font-size:17px;
    font-weight:700;
    margin-bottom:8px;
    line-height:1.25;
  }

  .title a{
    color:inherit;
    text-decoration:none;
  }

  .title a:hover{
    text-decoration:underline;
  }

  .meta{
    color:#6b7280;
    font-size:13px;
    margin-bottom:10px;
  }

  .tickers{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .tag{
    padding:4px 9px;
    border-radius:999px;
    background:#eef2ff;
    font-size:12px;
  }

  /* ----------- RESPONSIVO (CELULAR) ----------- */
  @media (max-width: 760px){
    .topbar{
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 14px 16px;
      border-radius:0 0 14px 14px;
    }

    .topbar h1{
      font-size:18px;
    }

    .topbar nav{
      width:100%;
      overflow-x:auto;
      gap:10px;
    }

    .topbar nav a{
      font-size:14px;
      padding:6px 10px;
    }

    .news-widget{
      padding:16px;
      margin:18px;
    }

    .cards{
      grid-template-columns:1fr;
    }

    .card-img{
      height:180px;
    }
  }
</style>
</head>

<body>

<header class="topbar">
  <h1>AG Finance</h1>

  <nav>
    <a href="#">Dashboard</a>
    <a href="#">Ações</a>
    <a href="#">Carteira</a>
    <a href="noticia/noticia.html">Notícias</a>
    <a href="#">Configurações</a>
  </nav>
</header>

<div class="news-widget">
  <h2>🪙 Destaques do CoinTelegraph</h2>

  <div id="cards" class="cards">
    <p>Carregando notícias…</p>
  </div>
</div>

<script>
async function loadNews(){

  const feed = "https://cointelegraph.com/rss";
  const url =
    `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed)}`;

  const container = document.getElementById("cards");
  container.innerHTML = "<p>Carregando notícias…</p>";

  try {
    const res  = await fetch(url);
    const data = await res.json();

    if (!data.items){
      container.innerHTML = "<p>Sem notícias no momento.</p>";
      return;
    }

    container.innerHTML = "";

    data.items.slice(0, 6).forEach(item => {

      const img =
        (item.enclosure && item.enclosure.link) ||
        item.thumbnail ||
        "https://via.placeholder.com/800x450?text=Cripto";

      const card = `
        <div class="card">
          <a href="${item.link}" target="_blank" rel="noopener">
            <img class="card-img" src="${img}" alt="">
          </a>

          <div class="card-body">
            <div class="title">
              <a href="${item.link}" target="_blank" rel="noopener">
                ${item.title}
              </a>
            </div>

            <div class="meta">
              CoinTelegraph • ${new Date(item.pubDate).toLocaleDateString("pt-BR")}
            </div>

            <div class="tickers">
              <span class="tag">BTC</span>
              <span class="tag">ETH</span>
              <span class="tag">ALT</span>
            </div>
          </div>
        </div>
      `;

      container.insertAdjacentHTML("beforeend", card);
    });

  } catch (e) {
    console.error(e);
    container.innerHTML = "<p>Erro ao carregar notícias.</p>";
  }
}

loadNews();
setInterval(loadNews, 120000);
</script>

</body>
</html>
